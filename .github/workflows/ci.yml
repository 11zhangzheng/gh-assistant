name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: docker build -t gh-assistant-python:3.12 docker
      - run: python -m coverage run --branch -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m coverage report --fail-under=85
      - run: python -m gh_assistant --state-dir .gha-ci runs
